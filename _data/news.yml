- date: "2026-11-24"
  label: "Nov 2026"
  text: "I released [SCOPE v0.2.0](https://github.com/securityCFS/SCOPE/releases/tag/v0.2.0), the open-source workbench I use to follow coding sessions and GPU jobs across machines."
- date: "2026-11-23"
  label: "Nov 2026"
  text: "[ABI is on arXiv](https://arxiv.org/abs/2611.30636). Pick a goal in the [AntMaze demo](#abi-demo) or run the policy yourself in the [Playground](https://securitycfs.github.io/ABI-demo/playground/)."
- date: "2026-11-08"
  label: "Nov 2026"
  text: "Our [SimplEvo preprint](https://arxiv.org/abs/2611.11509) and [code](https://github.com/securityCFS/SimplEvo-base) are public. The repo includes a small tabletop task for trying out memory refinement."
- date: "2026-10-26"
  label: "Oct 2026"
  text: "Our [EBench report](https://arxiv.org/abs/2610.35832) is on arXiv, studying direct robot control and an agent harness with post-trained policies."
- date: "2026-10-19"
  label: "Oct 2026"
  text: "[PICA-WAM](https://arxiv.org/abs/2610.26813) is on arXiv: learning visual perturbation invariance for world action models."
- date: "2026-09-25"
  label: "Sep 2026"
  text: "Collaborative technical reports [InternW0](https://arxiv.org/abs/2609.27656) and [InternW0-Δ](https://arxiv.org/abs/2609.31394) are available."
- date: "2026-09"
  label: "Sep 2026"
  text: "[InfCoiL](https://neurips.cc/virtual/2026/poster/152598) accepted to **NeurIPS 2026** — coordinated planning and control for physical human-object interaction."
- date: "2026-06"
  label: "Jun 2026"
  text: "[REAL](https://internrobotics.github.io/REAL/) accepted to **ECCV 2026**. Explore the paper, benchmark, and [open-source code](https://github.com/InternRobotics/REAL)."
