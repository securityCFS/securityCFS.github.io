<details class="abi-replay" data-abi-tracks="{{ '/assets/data/abi-antmaze.json' | relative_url }}">
  <summary class="abi-replay-link">Preview recorded AntMaze trajectories</summary>
  <div class="abi-panel" id="abi-antmaze-replay">
    <p class="abi-intro">Choose a recorded goal and scrub through the two paths. The runs share the same starting state, frozen policy, and random seed.</p>
    <div class="abi-interactive" hidden>
      <figure class="abi-map">
        <canvas width="480" height="480" role="img" aria-label="Recorded ant paths through a maze"></canvas>
        <figcaption><span class="abi-start-symbol"></span> Start <span class="abi-goal-symbol"></span> Goal</figcaption>
      </figure>
      <div class="abi-controls">
        <label for="abi-goal">Goal</label>
        <select id="abi-goal"></select>
        <dl class="abi-readings">
          <div><dt><span class="abi-line"></span>ABI-guided</dt><dd data-guided></dd></div>
          <div><dt><span class="abi-line abi-line--base"></span>Unguided</dt><dd data-base></dd></div>
        </dl>
        <label class="abi-timeline" for="abi-step">Step <span data-step></span></label>
        <input id="abi-step" type="range" min="0" step="1">
        <button type="button" data-play>Replay</button>
      </div>
    </div>
    <p class="abi-message" role="status" hidden></p>
    <noscript><p class="abi-source">Enable JavaScript to replay the paths, or <a href="{{ paper.videos.first.src | relative_url }}">watch the project video</a>.</p></noscript>
    <p class="abi-source">Set your own start and goal in the <a href="{{ paper.playgroundurl }}?env=antmaze-medium-navigate" target="_blank" rel="noopener noreferrer">live AntMaze Playground</a>.</p>
  </div>
</details>
